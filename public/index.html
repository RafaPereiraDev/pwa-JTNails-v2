<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tainara Nails</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>

  <!-- LOGIN PAGE -->
  <div id="login-page" class="page-login">
    <div class="login-card">
      <div class="login-logo">
        <span class="nail-icon"><i class="fa fa-hand-sparkles"></i></span>
        <h1>Tainara Nails</h1>
        <p>Sistema de Gestão</p>
      </div>
      <form id="login-form">
        <div class="form-group">
          <label>E-mail</label>
          <div class="input-icon">
            <i class="fa fa-envelope"></i>
            <input type="email" id="login-email" placeholder="seu@email.com" required />
          </div>
        </div>
        <div class="form-group">
          <label>Senha</label>
          <div class="input-icon">
            <i class="fa fa-lock"></i>
            <input type="password" id="login-password" placeholder="••••••••" required />
            <button type="button" class="btn-eye" onclick="togglePassword()"><i class="fa fa-eye" id="eye-icon"></i></button>
          </div>
        </div>
        <div id="login-error" class="alert alert-error" style="display:none"></div>
        <button type="submit" class="btn btn-primary btn-block" id="login-btn">
          <span>Entrar</span>
        </button>
      </form>
    </div>
  </div>

  <!-- APP LAYOUT -->
  <div id="app" style="display:none">

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <span class="nail-icon"><i class="fa fa-hand-sparkles"></i></span>
        <span class="sidebar-title">Tainara Nails</span>
        <button class="btn-close-sidebar" id="btn-close-sidebar" onclick="closeSidebar()" aria-label="Fechar menu"><i class="fa fa-times"></i></button>
      </div>
      <nav class="sidebar-nav">
        <a href="#" class="nav-item active" data-page="dashboard">
          <i class="fa fa-home"></i><span>Dashboard</span>
        </a>
        <a href="#" class="nav-item" data-page="agenda">
          <i class="fa fa-calendar"></i><span>Agenda</span>
        </a>
        <a href="#" class="nav-item" data-page="clients">
          <i class="fa fa-users"></i><span>Clientes</span>
        </a>
        <a href="#" class="nav-item" data-page="services">
          <i class="fa fa-paintbrush"></i><span>Serviços</span>
        </a>
        <a href="#" class="nav-item admin-only" data-page="professionals">
          <i class="fa fa-user-tie"></i><span>Profissionais</span>
        </a>
        <a href="#" class="nav-item" data-page="financial">
          <i class="fa fa-chart-line"></i><span>Financeiro</span>
        </a>
        <a href="#" class="nav-item admin-only" data-page="reports">
          <i class="fa fa-file-alt"></i><span>Relatórios</span>
        </a>
        <a href="#" class="nav-item admin-only" data-page="settings">
          <i class="fa fa-cog"></i><span>Configurações</span>
        </a>
      </nav>
      <div class="sidebar-footer">
        <div class="user-info" id="sidebar-user-info">
          <div class="user-avatar" id="user-avatar">A</div>
          <div>
            <div class="user-name" id="user-name-display">Admin</div>
            <div class="user-role" id="user-role-display">Administrador</div>
          </div>
        </div>
        <button class="btn-logout" onclick="logout()"><i class="fa fa-sign-out-alt"></i></button>
      </div>
    </aside>

    <!-- Overlay for mobile -->
    <div class="sidebar-overlay" id="sidebar-overlay" onclick="closeSidebar()"></div>

    <!-- Main content -->
    <div class="main-content" id="main-content">
      <header class="topbar">
        <button class="btn-menu" id="btn-menu" onclick="toggleSidebar()">
          <i class="fa fa-bars"></i>
        </button>
        <div class="topbar-title" id="topbar-title">Dashboard</div>
        <div class="topbar-actions">
          <button class="btn btn-primary btn-sm" onclick="openNewAppointment()">
            <i class="fa fa-plus"></i> <span class="hide-xs">Agendamento</span>
          </button>
        </div>
      </header>

      <!-- PAGES -->
      <div class="page-content" id="page-dashboard">
        <!-- filled by JS -->
      </div>

      <div class="page-content" id="page-agenda" style="display:none">
      </div>

      <div class="page-content" id="page-clients" style="display:none">
      </div>

      <div class="page-content" id="page-services" style="display:none">
      </div>

      <div class="page-content" id="page-professionals" style="display:none">
      </div>

      <div class="page-content" id="page-financial" style="display:none">
      </div>

      <div class="page-content" id="page-reports" style="display:none">
      </div>

      <div class="page-content" id="page-settings" style="display:none">
      </div>

    </div>
  </div>

  <!-- MODAL OVERLAY -->
  <div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
    <div class="modal" id="modal-container">
      <div class="modal-header">
        <h3 id="modal-title">Título</h3>
        <button class="btn-close-modal" onclick="closeModal()"><i class="fa fa-times"></i></button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <!-- TOAST NOTIFICATION -->
  <div id="toast-container"></div>

  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/modal.js"></script>
  <script src="js/pages/dashboard.js"></script>
  <script src="js/pages/agenda.js"></script>
  <script src="js/pages/clients.js"></script>
  <script src="js/pages/services.js"></script>
  <script src="js/pages/professionals.js"></script>
  <script src="js/pages/financial.js"></script>
  <script src="js/pages/reports.js"></script>
  <script src="js/pages/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
